[project]
name = "zktools"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "nuitka>=4.3",
    "pyside6>=6.12",
]

[tool.basedpyright]
# recommended (Default) / standard / strict，非standard会报出大量"缺类型注解 / 第三方库无 stub" 的噪音
typeCheckingMode = "standard"
exclude = ["dist", ".venv", "build", "__pycache__", "test.py"]
