[project]
name = "zktools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "logging>=0.4.9.6",
    "nuitka>=4.2",
    "pynput>=1.8.2",
    "pyside6>=6.11.1",
    "uiautomation>=2.0.29",
]

[tool.basedpyright]
# recommended (Default) / standard / strict，非standard会报出大量"缺类型注解 / 第三方库无 stub" 的噪音
typeCheckingMode = "standard"
exclude = ["dist", ".venv", "build", "__pycache__", "test.py"]
